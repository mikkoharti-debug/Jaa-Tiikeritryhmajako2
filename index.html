<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4f2f"><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui;color:#10221a;background:#eef5f1}body{margin:0}main{max-width:780px;margin:auto;padding:16px}section{background:white;border:1px solid #ccd8d1;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:26px}h2{font-size:19px}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center}.player{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #e5ebe7}button,select,input,textarea{font:inherit}button{padding:10px 13px;border:0;border-radius:10px;background:#dce7e0;font-weight:700;margin:4px}.primary{width:100%;background:#0b6b40;color:white;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid>div{padding:12px;border-radius:12px}.group{background:#e8f2ff}.goal{background:#fff2bf}.dark{background:#17211c;color:white}.light{background:white;border:1px solid #9eaaa3}.swap{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}#preview{max-height:260px;max-width:100%;display:block;margin-top:10px}textarea{box-sizing:border-box;width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #9eaaa3}@media(max-width:560px){.grid{grid-template-columns:1fr}.swap{grid-template-columns:1fr 1fr}.swap button{grid-column:1/-1}.player{grid-template-columns:1fr auto}.player .mv{grid-column:2}.bar{align-items:flex-start;flex-direction:column}}
.addplayer{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:12px 0;border-top:2px solid #dce7e0;margin-top:8px}.addplayer input[type=text]{min-width:0;padding:10px;border:1px solid #9eaaa3;border-radius:10px}@media(max-width:560px){.addplayer{grid-template-columns:1fr 1fr}.addplayer input[type=text]{grid-column:1/-1}.addplayer button{grid-column:1/-1}}</style><title>Jaa-Tiikerit ryhmajakaja</title></head><body><main><h1>🏒 Jää-Tiikerit – ryhmäjakaja</h1><section><h2>1. Osallistujalistan kuva</h2><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden></section><section><div class="bar"><h2>2. Valitse mukana olevat</h2><div><button id="all">Kaikki</button><button id="none">Tyhjennä</button></div></div><div id="players"></div><div class="addplayer"><input id="newName" type="text" placeholder="Uuden pelaajan nimi"><select id="newLevel"><option value="1">Taso 1</option><option value="2">Taso 2</option><option value="3" selected>Taso 3</option><option value="4">Taso 4</option><option value="5">Taso 5</option></select><label><input id="newGoalie" type="checkbox"> MV</label><button id="addPlayer" type="button">+ Lisää pelaaja</button></div><button class="primary" id="divide">Jaa kolmeen ryhmään</button><p id="status"></p></section><section id="groupsSec" hidden><h2>3. Tasoryhmät</h2><div id="groups" class="grid"></div><h3>Muokkaa jakoa</h3><div class="swap"><select id="a"></select><select id="b"></select><button id="swap">Vaihda</button></div><button class="primary" id="shirts">Tee tummat ja vaaleat</button></section><section id="final" hidden><h2>4. Valmis pelijako</h2><div class="grid"><div class="goal"><h3>🥅 Maalivahdit</h3><div id="goalies"></div></div><div class="dark"><h3>⚫ Tummat</h3><div id="darks"></div></div><div class="light"><h3>⚪ Vaaleat</h3><div id="lights"></div></div></div><button id="shuffle">🔀 Sekoita paitavärit</button><button id="copy">Kopioi lista</button><label for="text">Kopioitava lista</label><textarea id="text" rows="14" readonly></textarea><p id="copyStatus"></p></section></main><script>let data=[['Albert Kallio',3],['Eino',3],['Eljas Niemelä',1],['Henry Mäntylä',3],['Jeremias Päivinen',5],['Jesse Salo',4],['Konsta Pasanen',2],['Lehikoinen Julianna',1],['Lenni Hartikainen',5],['Luukas Virtanen',4],['Matvei Zhuravlov',3],['Minea',1],['Niklas Siitonen',2],['Nooa Nieminen',4],['Oiva Tittonen',5],['Onni Hautamäki',5],['Rafael Laine',5],['Robin Veskioja',2],['Valo Salmi',5],['Veeti Pajula',3],['Venni Alastalo',3],['Venni Heikinheimo',5]].map((x,id)=>({id,name:x[0],level:x[1]}));
let groups=[[],[],[]],goalies=[],dark=[],light=[];const $=s=>document.querySelector(s);const ph=$('#players');
data.forEach(p=>{let d=document.createElement('div');d.className='player';d.innerHTML=`<label><input class="active" data-id="${p.id}" type="checkbox"> ${p.name}</label><select class="level" data-id="${p.id}">${[1,2,3,4,5].map(n=>`<option ${n===p.level?'selected':''}>${n}</option>`).join('')}</select><label class="mv"><input class="goalie" data-id="${p.id}" type="checkbox"> MV</label>`;ph.append(d)});
$('#all').onclick=()=>document.querySelectorAll('.active').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.active,.goalie').forEach(x=>x.checked=false);document.querySelectorAll('.goalie').forEach(x=>x.onchange=()=>{if(x.checked)document.querySelector(`.active[data-id="${x.dataset.id}"]`).checked=true});
$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;$('#preview').src=URL.createObjectURL(f);$('#preview').hidden=false};
function chosen(){return data.filter(p=>document.querySelector(`.active[data-id="${p.id}"]`).checked).map(p=>({...p,level:+document.querySelector(`.level[data-id="${p.id}"]`).value}))} function isG(id){return document.querySelector(`.goalie[data-id="${id}"]`).checked}
function renderGroups(){let h=$('#groups');h.innerHTML='';groups.forEach((g,i)=>{let d=document.createElement('div');d.className='group';d.innerHTML=`<b>Ryhmä ${i+1}</b>${g.map(p=>`<div>${p.name} (${p.level})</div>`).join('')}`;h.append(d)});let opts=groups.flat().map(p=>`<option value="${p.id}">${p.name} – R${groups.findIndex(g=>g.some(x=>x.id===p.id))+1}</option>`).join('');$('#a').innerHTML=opts;$('#b').innerHTML=opts;if($('#b').options.length>1)$('#b').selectedIndex=1}
$('#divide').onclick=()=>{let c=chosen();if(c.length<3){$('#status').textContent='Valitse vähintään kolme osallistujaa.';return}goalies=c.filter(p=>isG(p.id));let f=c.filter(p=>!isG(p.id)).sort((a,b)=>b.level-a.level||a.name.localeCompare(b.name,'fi'));let base=Math.floor(f.length/3),extra=f.length%3,pos=0;groups=[[],[],[]];for(let i=0;i<3;i++){let size=base+(i<extra?1:0);groups[i]=f.slice(pos,pos+size);pos+=size}renderGroups();$('#groupsSec').hidden=false;$('#final').hidden=true;$('#status').textContent=`Jako valmis: ${f.length} kenttäpelaajaa ja ${goalies.length} maalivahtia.`};
$('#swap').onclick=()=>{let A=+$('#a').value,B=+$('#b').value;if(A===B)return;let ia,ja,ib,jb;groups.forEach((g,i)=>g.forEach((p,j)=>{if(p.id===A){ia=i;ja=j}if(p.id===B){ib=i;jb=j}}));if(ia==null||ib==null)return;[groups[ia][ja],groups[ib][jb]]=[groups[ib][jb],groups[ia][ja]];renderGroups()};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function shirts(){dark=[];light=[];groups.forEach(g=>{let s=shuffle(g),start=Math.random()<.5;s.forEach((p,i)=>(((i%2===0)===start)?dark:light).push(p))});while(dark.length>light.length+1)light.push(dark.pop());while(light.length>dark.length+1)dark.push(light.pop());renderFinal()}
function renderFinal(){let fill=(s,a)=>$(s).innerHTML=a.length?a.map(p=>`<div>${p.name}</div>`).join(''):'<div>Ei valittuja</div>';fill('#goalies',goalies);fill('#darks',dark);fill('#lights',light);$('#text').value='MAALIVAHDIT\n'+goalies.map(p=>p.name).join('\n')+'\n\nTUMMAT\n'+dark.map(p=>p.name).join('\n')+'\n\nVAALEAT\n'+light.map(p=>p.name).join('\n');$('#final').hidden=false}
$('#shirts').onclick=shirts;$('#shuffle').onclick=shirts;$('#copy').onclick=async()=>{let t=$('#text');try{await navigator.clipboard.writeText(t.value);$('#copyStatus').textContent='Lista kopioitu.'}catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);$('#copyStatus').textContent='Lista on valittu. Valitse puhelimesta Kopioi.'}};


$('#addPlayer').onclick=()=>{let name=$('#newName').value.trim();if(!name){$('#status').textContent='Kirjoita uuden pelaajan nimi.';return}let level=+$('#newLevel').value,goalie=$('#newGoalie').checked,id=data.length?Math.max(...data.map(p=>p.id))+1:0,p={id,name,level};data.push(p);let d=document.createElement('div');d.className='player';d.innerHTML=`<label><input class="active" data-id="${p.id}" type="checkbox" checked> ${p.name}</label><select class="level" data-id="${p.id}">${[1,2,3,4,5].map(n=>`<option ${n===p.level?'selected':''}>${n}</option>`).join('')}</select><label class="mv"><input class="goalie" data-id="${p.id}" type="checkbox" ${goalie?'checked':''}> MV</label>`;ph.append(d);let g=d.querySelector('.goalie');g.onchange=()=>{if(g.checked)d.querySelector('.active').checked=true};$('#newName').value='';$('#newLevel').value='3';$('#newGoalie').checked=false;$('#status').textContent=`${name} lisätty osallistujaksi.`};

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
